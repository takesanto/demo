<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KPI Board Mock</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>KPI Board Mock</h1>
      <div class="topbar-actions">
        <button id="addKpiBtn">KPI追加</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel">
        <h2>カテゴリ</h2>
        <ul id="categoryList"></ul>
      </aside>

      <section class="panel board">
        <h2 id="boardTitle">KPI一覧</h2>
        <div id="kpiCards" class="kpi-grid"></div>
      </section>

      <aside class="panel editor">
        <h2>編集</h2>
        <form id="kpiForm">
          <label>
            タイトル
            <input id="titleInput" required />
          </label>
          <label>
            進捗(%)
            <input id="progressInput" type="number" min="0" max="100" required />
          </label>
          <label>
            メモ
            <textarea id="memoInput" rows="4"></textarea>
          </label>
          <div class="form-actions">
            <button type="submit">保存</button>
            <button type="button" id="deleteBtn" class="danger">削除</button>
          </div>
        </form>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
